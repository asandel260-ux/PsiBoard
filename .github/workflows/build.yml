name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: bash .github/scripts/fetch_font.sh
      - run: bash .github/scripts/fetch_dicts.sh
      - run: gradle assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk PsiBoard.apk
      - uses: actions/upload-artifact@v4
        with: { name: PsiBoard-apk, path: PsiBoard.apk }
      - id: ver
        run: echo "v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: PsiBoard v${{ steps.ver.outputs.v }}
          files: PsiBoard.apk
          generate_release_notes: true
          body: |
            **Install:** download `PsiBoard.apk` below and open it (allow "install unknown apps" if Android asks). Then open PsiBoard and follow the two setup steps: enable it, then select it as your keyboard.
            If Android refuses to install over an older PsiBoard, uninstall the old one first (each build is signed with a fresh debug key).

            **0.4.1**
            - Optimized (R8-shrunk) build: about 0.4 MB, not debuggable
            - Real English and Persian word lists, so suggestions and autocorrect have far more to work with
            - Landscape: shorter rows, number row off by default (new setting to bring it back)
            - Symbols page keeps the same keyboard height as the letters page
            - Clipboard and emoji panels get pill-style headers; long-press popups have shadows; lighter drawing while typing
            - Settings: visible slider tracks, preview follows the screen orientation

            Design notes and credits are in the README.
