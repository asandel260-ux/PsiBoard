name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: bash .github/scripts/fetch_font.sh
      - run: gradle assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk PsiBoard.apk
      - uses: actions/upload-artifact@v4
        with: { name: PsiBoard-apk, path: PsiBoard.apk }
      - id: ver
        run: echo "v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: PsiBoard v${{ steps.ver.outputs.v }}
          files: PsiBoard.apk
          generate_release_notes: true
