name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: bash .github/scripts/fetch_font.sh
      - run: gradle assembleDebug --stacktrace
      - run: cp app/build/outputs/apk/debug/app-debug.apk PsiBoard.apk
      - uses: actions/upload-artifact@v4
        with: { name: PsiBoard-apk, path: PsiBoard.apk }
      - id: ver
        run: echo "v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> $GITHUB_OUTPUT
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ steps.ver.outputs.v }}
          name: PsiBoard v${{ steps.ver.outputs.v }}
          files: PsiBoard.apk
          generate_release_notes: true
          body: |
            **Install:** download `PsiBoard.apk` below and open it (allow "install unknown apps" if Android asks). Then open PsiBoard and follow the two setup steps: enable it, then select it as your keyboard.
            If Android refuses to install over an older PsiBoard, uninstall the old one first (each build is signed with a fresh debug key).

            **0.4.0 - redesign**
            - Theme engine based on OKLCH color science: light / dark / AMOLED / Material You, key labels kept at 9:1 contrast or better
            - 48 dp row pitch, touch-point correction, key hit areas with no dead gaps
            - Persian: Vazirmatn font, aligned rows, half-space (ZWNJ) key, ژ on long-press of ز
            - Key preview bubbles and long-press popups, press animation, icons on the Enter key
            - New settings screen with a live keyboard preview

